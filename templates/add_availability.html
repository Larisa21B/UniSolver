{% extends "base.html" %}

{% block content %}
<h1>Adaugă disponibilitate</h1>

<form method="POST">
    {% csrf_token %}

    <label>Ziua săptămânii</label>
    <input type="text" name="day_of_week" placeholder="Luni" required>

    <label>Ora început</label>
    <input type="time" name="start_time" required>

    <label>Ora sfârșit</label>
    <input type="time" name="end_time" required>

    <button type="submit">Salvează disponibilitatea</button>
</form>
{% endblock %}
